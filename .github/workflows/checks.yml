name: Checks

# Static relay invariants (tests/verify-relay-invariants.sh): pins vs the
# AGENTS.md table, checksum steps, MagicDNS / loop-guard / boot-gate text,
# and byte-identity of every duplicated script. Cheap, so it runs on every
# push and PR. On a published release it also checks that the tag is a bare
# X.Y.Z, then attaches the installer, stamped with that tag, to the release
# (release-assets below).

on:
  push:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  invariants:
    name: Relay invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify relay invariants
        run: bash tests/verify-relay-invariants.sh

      # Release tags carry no "v" prefix (0.3.0, not v0.3.0). docker.yml's
      # :latest selection and :0 guard only understand bare X.Y.Z, and
      # v0.3.1 (2026-10-27) slipped through both: no :latest, a stray :0,
      # and a release marked Latest with no assets. A prerelease may add a
      # suffix (0.4.0-rc.1). The same check gates docker.yml; this copy
      # stops the assets, which are stamped with the tag below. The tag goes
      # through env, not ${{ }} inside the script, so a crafted tag name
      # cannot inject shell.
      - name: Release tag is X.Y.Z
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::release tag '${TAG}' is not X.Y.Z (no v prefix); delete the release and tag, then publish it again as X.Y.Z"
            exit 1
          fi
          echo "release tag ${TAG} is well formed"

  # A GitHub release used to produce only a container image; the host
  # installer was never attached, so the README could only point curl | bash
  # at the mutable main branch. Every release now carries tailwag.sh, a
  # SHA256SUMS file and a GitHub artifact attestation for the script:
  #   gh attestation verify tailwag.sh -R gradientc/Tailwag
  # Runs only after the invariants and the tag format check pass.
  release-assets:
    name: Attach tailwag.sh to the release
    if: github.event_name == 'release'
    needs: invariants
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # artifact attestation (Sigstore OIDC)
      attestations: write  # artifact attestation (GitHub store)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # VERSION used to be bumped by hand in a release PR and checked against
      # the tag here. Forgetting the bump failed the 0.3.1 release and left it
      # without assets, all for one line. The source now says "dev" (pinned by
      # verify-relay-invariants.sh) and the tag is stamped in before the
      # checksum and the attestation, so both cover the stamped file. TAG is
      # safe in sed: the invariants job allowed only [0-9A-Za-z.-].
      - name: Stamp the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed -i "s/^readonly VERSION=\"dev\"\$/readonly VERSION=\"${TAG}\"/" tailwag.sh
          grep -qxF "readonly VERSION=\"${TAG}\"" tailwag.sh \
            || { echo "::error file=tailwag.sh::could not stamp VERSION=${TAG}"; exit 1; }
          echo "tailwag.sh stamped VERSION=${TAG}"

      - name: Checksums
        run: sha256sum tailwag.sh > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: tailwag.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" tailwag.sh SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
