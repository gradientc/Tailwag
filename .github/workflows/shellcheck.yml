name: ShellCheck

on: [push, pull_request]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          # ludeeus/action-shellcheck turns each entry into `find -name *ENTRY`,
          # so ONLY basenames work (paths like docker/run or .agents/setup do
          # not). Recursive scandir already picks up every *.sh; these cover
          # the extensionless scripts that carry a shell shebang.
          additional_files: 'setup resume run'
