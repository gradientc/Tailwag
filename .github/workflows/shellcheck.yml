name: ShellCheck

on: [push, pull_request]

# Read-only token: the action only checks out and lints (CodeQL
# actions/missing-workflow-permissions, CWE-275).
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          # ludeeus/action-shellcheck turns each entry into `find -name *ENTRY`,
          # so ONLY basenames work (paths like docker/run or .agents/setup do
          # not). Recursive scandir already picks up every *.sh; these cover
          # the extensionless scripts that carry a shell shebang.
          additional_files: 'setup resume run wait-listen-addrs tailwag-health'
